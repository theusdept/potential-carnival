name: ReturnGuard CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/returnguard
      SHOPIFY_API_KEY: test_key
      SHOPIFY_API_SECRET: test_secret
      SHOPIFY_APP_URL: https://example.com
      SCOPES: read_orders
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: returnguard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d returnguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Deploy test database migrations
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Runtime HTTP health and legal-page smoke test
        env:
          PORT: "3000"
          SHOPIFY_APP_GID: "gid://shopify/App/1"
          SHOPIFY_APP_HANDLE: "returnguard"
          SHOPIFY_PARTNER_ORG_ID: "1"
          SHOPIFY_PARTNER_API_ACCESS_TOKEN: "test_partner"
          S3_ENDPOINT: "https://s3.example.com"
          S3_BUCKET: "test-bucket"
          S3_REGION: "auto"
          S3_URL_STYLE: "virtual"
          S3_ACCESS_KEY_ID: "test_access"
          S3_SECRET_ACCESS_KEY: "test_secret"
          RESEND_API_KEY: "test_resend"
          PRIVACY_FROM_EMAIL: "privacy@example.com"
          LEGAL_OPERATOR_NAME: "ReturnGuard Test Operator"
          SUPPORT_EMAIL: "support@example.com"
        run: |
          npm run start > /tmp/returnguard-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          healthy=0
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:3000/health > /tmp/health.json; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ] || ! grep -q '"status":"ok"' /tmp/health.json; then
            cat /tmp/returnguard-server.log
            exit 1
          fi
          curl --silent --fail http://127.0.0.1:3000/ > /tmp/home.html
          curl --silent --fail http://127.0.0.1:3000/privacy > /tmp/privacy.html
          curl --silent --fail http://127.0.0.1:3000/terms > /tmp/terms.html
          grep -q 'ReturnGuard' /tmp/home.html
          grep -q 'Privacy Policy' /tmp/privacy.html
          grep -q 'Terms of Service' /tmp/terms.html
